<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>LOTO 2026 · Estrategia de Precursores y Palé Activo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at 20% 30%, #0b1c2f, #051018);
      min-height: 100vh; padding: 15px; color: #f0f4fa;
    }
    .app-container { max-width:1400px; margin:0 auto; }
    .header {
      display:flex; flex-direction:column; align-items:center; margin-bottom:25px;
    }
    .logo {
      font-size:4rem; font-weight:900;
      background: linear-gradient(135deg, #fff8e0, #fff);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; text-shadow: 0 0 25px rgba(255,255,255,0.3);
    }
    .datetime {
      background:#0e2638; padding:10px 25px; border-radius:30px;
      font-weight:bold; color:#ffd966; font-size:1.1rem; margin-top:5px;
    }
    .nav-tabs {
      display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;
      border-bottom:2px solid #2e4e6c; padding-bottom:12px; justify-content:center;
    }
    .tab-btn {
      background:transparent; border:none; padding:12px 20px;
      font-size:1rem; font-weight:700; color:#bcd3f0;
      border-radius:40px 40px 0 0; cursor:pointer; transition:0.2s;
    }
    .tab-btn.active { background:#1f3f5c; color:#ffd966; box-shadow:0 -4px 10px rgba(0,0,0,0.3); }
    .portada { display:none; animation:fade 0.3s; }
    .portada.active { display:block; }
    @keyframes fade { from{opacity:0.3} to{opacity:1} }

    .card {
      background: rgba(10,25,40,0.75); backdrop-filter:blur(10px);
      border:1px solid #2e5a7a; border-radius:28px; padding:22px;
      margin-bottom:25px; box-shadow:0 15px 30px rgba(0,0,0,0.5);
    }
    .card h2 { color:#ffd966; margin-bottom:18px; border-left:8px solid #e6b800; padding-left:18px; font-weight:700; }
    .signal-card {
      background:#0e2638; border-left:8px solid; border-radius:18px;
      padding:20px; margin-bottom:18px;
    }
    .priority-high { border-color:#e6b800; }
    .number-highlight {
      font-size:2.8rem; font-weight:800; background:#00000040;
      padding:2px 20px; border-radius:50px; display:inline-block;
    }
    .alert-warning {
      background:#3a2c0e; border-left:8px solid #e6b800;
      padding:20px; border-radius:18px; color:#ffe5a3;
    }
    .route-badge {
      display:inline-block; background:#1e405b; padding:6px 14px;
      border-radius:20px; margin:4px; font-size:0.9rem;
    }
    .gold-btn {
      background: linear-gradient(145deg, #f3c84e, #c99d1e); border:none;
      padding:14px 28px; border-radius:50px; font-weight:bold; font-size:1.2rem;
      color:#0a1c2c; box-shadow:0 5px 0 #7a5c00, 0 6px 15px black;
      cursor:pointer; border:1px solid #ffea9e; transition:0.1s;
    }
    .gold-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #7a5c00; }
    .btn-outline-light {
      background:transparent; border:2px solid #bcd3f0; color:#bcd3f0;
      padding:10px 20px; border-radius:40px; font-weight:bold; cursor:pointer;
    }
    table { width:100%; border-collapse:collapse; color:#e0ecf9; }
    th { background:#1d4e6e; color:#ffdb7c; padding:12px; text-align:left; }
    td { padding:10px; border-bottom:1px solid #2c6080; }
    .grid-7 { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; }
    .input-group { background:#0e2638; padding:12px; border-radius:18px; }
    .input-group label { display:block; margin-bottom:6px; color:#ffd966; }
    .input-group input {
      width:100%; padding:10px; border-radius:30px; border:none;
      background:#1e405b; color:white; font-weight:bold; text-align:center; margin-top:5px;
    }
    @media (max-width:600px) { .logo { font-size:2.5rem; } }
  </style>
</head>

    function formatoHora(h) {
        if(!h) return '';
        const [hh,mm] = h.split(':');
        let hora = parseInt(hh);
        const ampm = hora >= 12 ? 'PM' : 'AM';
        if (hora > 12) hora -= 12;
        if (hora === 0) hora = 12;
        return `${hora}:${mm} ${ampm}`;
    }

    // Pronóstico A
    function calcPronosticoA() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const ultimos7 = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 7);
        const activos = [];
        NUMEROS_CLAVE.forEach(num => {
            const ocurrencias = ultimos7.filter(s => s.p2 === num || s.p3 === num);
            if(ocurrencias.length === 0) return;
            const ultima = ocurrencias[ocurrencias.length-1];
            const cfg = estrategias[num];
            if(!cfg) return;
            const diasRest = cfg.ventana - Math.floor((ahora - new Date(ultima.fecha))/86400000);
            if(diasRest <= 0) return;
            activos.push({ numero:num, fecha:ultima.fecha, pos:ultima.p2===num?'2ª':'3ª', loteria:ultima.loteria, horario:ultima.horario, cfg, diasRest });
        });
        return activos;
    }

    function renderPronosticoA() {
        const activos = calcPronosticoA();
        let html = '';
        if(activos.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Ningún número clave activo.</div>';
        else activos.forEach(a => {
            html += `<div class="signal-card priority-high"><div style="font-size:0.9rem; color:#bcd3f0;">🗓️ ${a.fecha} · ${a.loteria} ${formatoHora(a.horario)}</div><div style="display:flex; align-items:center; margin-top:5px;"><span class="number-highlight">${a.numero}</span><span style="margin-left:15px;">📡 Señal ${a.pos}</span></div><p style="margin-top:10px;">🎯 <strong>${a.cfg.objetivo}</strong> · Ventana: ${a.cfg.ventana} días (${a.diasRest} restantes)</p><div style="display:flex; gap:15px; margin-top:12px; flex-wrap:wrap;">${a.cfg.combos.map(c => `<code style="background:#1e405b; padding:8px 16px; border-radius:30px;">${c[0]}-${c[1]}-${c[2]}</code>`).join('')}</div></div>`;
        });
        document.getElementById('contenedorA').innerHTML = html;
    }

    // Pronóstico B
    function calcPronosticoB() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 3);
        const resultados = [];
        const procesados = new Set();
        recientes.forEach(s => {
            [s.p2, s.p3].forEach(num => {
                if(procesados.has(num)) return;
                procesados.add(num);
                const totalApariciones = sorteos.filter(x => x.p2===num || x.p3===num).length;
                const exitos = sorteos.filter(x => (x.p2===num || x.p3===num) && sorteos.some(y => y.fecha >= x.fecha && y.fecha <= x.fecha+3 && y.p1===num)).length;
                if(totalApariciones >= 3 && (exitos/totalApariciones) >= 0.5) resultados.push({ numero:num, tasa:Math.round(exitos/totalApariciones*100), total:totalApariciones, exitos });
            });
        });
        return resultados;
    }

    function renderPronosticoB() {
        const arrastres = calcPronosticoB();
        let html = '';
        if(arrastres.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin arrastres confiables.</div>';
        else arrastres.forEach(a => { html += `<div class="signal-card" style="border-color:#ff9966;"><div style="display:flex; align-items:center;"><span class="number-highlight">${a.numero}</span><span style="margin-left:15px;">🔥 Arrastre histórico: ${a.tasa}% (${a.exitos} de ${a.total})</span></div><p style="margin-top:10px;">📈 Tiende a aparecer en 1ª posición en 3 días.</p></div>`; });
        document.getElementById('contenedorB').innerHTML = html;
    }

    // Pronóstico C
    function calcPercutores() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 3);
        const percutorsMap = new Map();
        for(let i=0; i<sorteos.length; i++) {
            const s = sorteos[i];
            const Ys = [s.p2, s.p3];
            const siguientes = sorteos.filter(x => x.fecha >= s.fecha && x.fecha <= s.fecha+3);
            siguientes.forEach(x => {
                const X = x.p1;
                Ys.forEach(Y => {
                    if(Y === X) return;
                    if(!percutorsMap.has(Y)) percutorsMap.set(Y, new Map());
                    const inner = percutorsMap.get(Y);
                    if(!inner.has(X)) inner.set(X, {aciertos:0, total:0});
                    inner.get(X).aciertos++;
                });
            });
        }
        const totalY = {};
        sorteos.forEach(s => { [s.p2, s.p3].forEach(Y => { totalY[Y] = (totalY[Y]||0)+1; }); });
        const activos = [];
        recientes.forEach(s => {
            [s.p2, s.p3].forEach(Y => {
                if(!percutorsMap.has(Y)) return;
                const candidatos = [];
                percutorsMap.get(Y).forEach((val, X) => {
                    if(val.aciertos >= 3 && totalY[Y] && (val.aciertos/totalY[Y]) >= 0.5) candidatos.push({ X, tasa:Math.round(val.aciertos/totalY[Y]*100) });
                });
                if(candidatos.length > 0) {
                    candidatos.sort((a,b)=> b.tasa - a.tasa);
                    activos.push({ Y, destinos:candidatos.slice(0,3) });
                }
            });
        });
        return activos;
    }

    function renderPronosticoC() {
        const percutores = calcPercutores();
        let html = '';
        if(percutores.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin percutores válidos.</div>';
        else percutores.forEach(p => {

        });
        document.getElementById('contenedorC').innerHTML = html;
    }

    // Pronóstico D
    function calcDobles() {
        const dobles = ['00','11','22','33','44','55','66','77','88','99'];
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 2);
        const presentes = new Set();
        recientes.forEach(s => { if(dobles.includes(s.p1) || dobles.includes(s.p2) || dobles.includes(s.p3)) presentes.add(s.p1); });
        return Array.from(presentes).filter(n => dobles.includes(n));
    }

    function renderPronosticoD() {
        const dobles = calcDobles();
        let html = '';
        if(dobles.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin dobles activos.</div>';
        else dobles.forEach(d => { html += `<div class="signal-card" style="border-color:#f4d03f; background:#1e2f1e;"><div style="display:flex; align-items:center;"><span class="number-highlight">${d}</span><span style="margin-left:15px; color:#f4d03f;">👁️ OJO (doble detectado)</span></div><p style="margin-top:10px;">Históricamente, los dobles suelen repetirse o venir acompañados en 48h.</p></div>`; });
        document.getElementById('contenedorD').innerHTML = html;
    }

    // *** NUEVA FUNCIÓN: Palé Activo ***
    function calcPaleActivo() {
        const activos = calcPronosticoA().map(a => a.numero);
        if (activos.length === 0) return null;

        const parejasCount = {};
        sorteos.forEach(s => {
            const pares = [[s.p1, s.p2], [s.p1, s.p3], [s.p2, s.p3]];
            pares.forEach(par => {
                if (activos.includes(par[0]) || activos.includes(par[1])) {
                    const key = par.join('-');
                    parejasCount[key] = (parejasCount[key] || 0) + 1;
                }
            });
        });

        return Object.entries(parejasCount)
            .filter(([_, count]) => count >= 3)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5)
            .map(([key, count]) => ({ pareja: key, frecuencia: count }));
    }

    function renderPaleActivo() {
        const pales = calcPaleActivo();
        const container = document.getElementById('paleActivoContainer');
        if (!pales || pales.length === 0) {
            container.innerHTML = '<div class="alert-warning">⚠️ No jugar. No hay parejas activas con suficiente respaldo hoy.</div>';
            return;
        }
        let html = '';
        pales.forEach(p => {
            const numeros = p.pareja.split('-');
            html += `<div class="signal-card" style="border-color:#17a589;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight" style="font-size:2rem;">${numeros[0]}</span>
                    <span style="margin:0 15px; font-size:2rem;">•</span>
                    <span class="number-highlight" style="font-size:2rem;">${numeros[1]}</span>
                </div>
                <p style="margin-top:10px;">Frecuencia histórica: <strong>${p.frecuencia} apariciones</strong></p>
                <p style="font-size:0.9rem; color:#bcd3f0;">Activada por número clave del Pronóstico A</p>
            </div>`;
        });
        container.innerHTML = html;
    }

    function recalcAll() {
        renderPronosticoA();
        renderPronosticoB();
        renderPronosticoC();
        renderPronosticoD();
        renderPaleActivo();
    }

    function actualizarReloj() {
        const ahora = new Date();
        document.getElementById('liveDateTime').textContent = ahora.toLocaleDateString('es-ES',{weekday:'long', year:'numeric', month:'long', day:'numeric'}) + ' · ' + ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    const tabs = document.querySelectorAll('.tab-btn');
    const portadas = document.querySelectorAll('.portada');
    tabs.forEach(t => t.addEventListener('click', ()=>{
        const id = t.dataset.tab;
        tabs.forEach(bt => bt.classList.remove('active'));
        portadas.forEach(p => p.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(id).classList.add('active');
        if(id === 'historial') renderHistorial();
        else if(id === 'pronosticoA') renderPronosticoA();
        else if(id === 'pronosticoB') renderPronosticoB();
        else if(id === 'pronosticoC') renderPronosticoC();
        else if(id === 'pronosticoD') renderPronosticoD();
        else if(id === 'paleactivo') renderPaleActivo();
    }));

    renderHistorial();
    renderFormActualizar();
    recalcAll();
})();
</script>
</body>
</html>
