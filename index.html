];

const L={G:"GEORGIA",F:"FLORIDA",N:"NEW YORK"};const H={lot:[{l:"G",h:"1230",t:"Georgia 12:30 PM"},{l:"F",h:"0130",t:"Florida 01:30 PM"},{l:"N",h:"0230",t:"New York 02:30 PM"},{l:"G",h:"1900",t:"Georgia 07:00 PM"},{l:"F",h:"2150",t:"Florida 09:50 PM"},{l:"N",h:"2230",t:"New York 10:30 PM"},{l:"G",h:"2330",t:"Georgia 11:30 PM"}]};
const K=["61","73","00","89","99","56","70","16","41","28"];
const E={"61":{o:"GA/FL",v:3,c:[["61","73","11"],["61","57","63"],["61","69","88"]]},"73":{o:"GEORGIA",v:4,c:[["73","74","18"],["73","56","76"]]},"00":{o:"GEORGIA",v:3,c:[["00","82","87"],["00","37","14"],["00","59","03"]]},"89":{o:"FLORIDA",v:3,c:[["89","07","57"],["89","41","00"]]},"99":{o:"FLORIDA",v:3,c:[["99","51","75"],["99","00","07"]]},"56":{o:"GEORGIA",v:2,c:[["56","56","06"],["56","70","91"],["56","04","03"]]},"70":{o:"FLORIDA",v:3,c:[["70","08","22"],["70","12","37"],["70","68","75"]]},"16":{o:"GEORGIA",v:5,c:[["16","76","20"],["16","37","96"],["16","12","38"]]},"41":{o:"GEORGIA",v:3,c:[["41","64","86"],["41","02","67"],["41","98","06"]]},"28":{o:"NY",v:2,c:[["28","72","19"],["28","77","26"],["28","94","18"]]}};

function fmtH(h){if(!h)return"";let x=h.substring(0,2),y=h.substring(2,4),z=parseInt(x),a=z>=12?"PM":"AM";if(z>12)z-=12;if(z===0)z=12;return z+":"+y+" "+a}
function tagL(l){return'<span class="tag tag-'+l+'">'+L[l]+'</span>'}
function updClock(){const n=new Date();document.getElementById("liveDateTime").textContent=n.toLocaleDateString("es-ES",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+" · "+n.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
setInterval(updClock,1000);updClock();

function getA(){const now=new Date();now.setHours(0,0,0,0);const s7=D.filter(x=>(now-new Date("20"+x[0].substring(0,2)+"-"+x[0].substring(2,4)+"-"+x[0].substring(4,6)))/864e5<=7);const r=[];K.forEach(n=>{const oc=s7.filter(x=>x[4]===n||x[5]===n);if(!oc.length)return;const u=oc[oc.length-1],c=E[n];if(!c)return;const d=c.v-Math.floor((now-new Date("20"+u[0].substring(0,2)+"-"+u[0].substring(2,4)+"-"+u[0].substring(4,6)))/864e5);if(d<=0)return;r.push({n:n,f:u[0],p:u[4]===n?"2ª":"3ª",l:u[1],h:u[2],c:c,d:d})});return r}

function calcF(n){const c={};D.forEach(s=>{if(s[3]===n){const k=s[1]+" "+fmtH(s[2]);c[k]=(c[k]||0)+1}});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3)}

function rA(){const a=getA();let h="";if(!a.length)h='<div class="alert-warning">⚠️ Sin números clave activos</div>';else a.forEach(x=>{const f=calcF(x.n);let sf=f.length?f.map(y=>'<span class="route-badge">'+tagL(y[0].split(" ")[0])+" "+y[0].split(" ")[1]+" ("+y[1]+"v)</span>").join(" "):'<span class="route-badge">General</span>';h+='<div class="signal-card priority-high"><div style="font-size:0.85rem;color:#bcd3f0"> '+x.f+" · "+tagL(x.l)+" "+fmtH(x.h)+'</div><div style="display:flex;align-items:center;margin-top:5px"><span class="number-highlight">'+x.n+'</span><span style="margin-left:12px">📡 '+x.p+'</span></div><p style="margin-top:8px">🎯 <strong>'+x.c.o+"</strong> · "+x.c.v+" días ("+x.d+" restantes)</p><div style="margin-top:6px">🕒 "+sf+'</div><div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">'+x.c.c.map(z=>'<code style="background:#1e405b;padding:6px 12px;border-radius:20px">'+z[0]+"-"+z[1]+"-"+z[2]+"</code>").join("")+"</div></div>"});document.getElementById("cA").innerHTML=h}

function cB(){const now=new Date();now.setHours(0,0,0,0);const rec=D.filter(x=>(now-new Date("20"+x[0].substring(0,2)+"-"+x[0].substring(2,4)+"-"+x[0].substring(4,6)))/864e5<=3);const r=[],p=new Set();rec.forEach(s=>{[s[4],s[5]].forEach(n=>{if(p.has(n))return;p.add(n);const t=D.filter(x=>x[4]===n||x[5]===n).length;const e=D.filter(x=>(x[4]===n||x[5]===n)&&D.some(y=>y[0]>=x[0]&&y[0]<=String(Number(x[0])+3)&&y[3]===n)).length;if(t>=3&&(e/t)>=0.5)r.push({n:n,t:Math.round(e/t*100),tot:t,e:e})})});return r.slice(0,5)}

function rB(){const a=cB();let h="";if(!a.length)h='<div class="alert-warning">⚠️ Sin arrastres</div>';else a.forEach(x=>{const f=calcF(x.n);let sf=f.length?f.map(y=>'<span class="route-badge">'+tagL(y[0].split(" ")[0])+" "+y[1]+"v</span>").join(" "):"";h+='<div class="signal-card" style="border-color:#ff9966"><div style="display:flex;align-items:center"><span class="number-highlight">'+x.n+'</span><span style="margin-left:12px">🔥 '+x.t+"% ("+x.e+"/"+x.tot+')</span></div><p style="margin-top:8px">📈 1ª posición en 3 días</p>'+(sf?'<div style="margin-top:5px">🕒 '+sf+"</div>":"")+"</div>"});document.getElementById("cB").innerHTML=h}

function cC(){const now=new Date();now.setHours(0,0,0,0);const rec=D.filter(x=>(now-new Date("20"+x[0].substring(0,2)+"-"+x[0].substring(2,4)+"-"+x[0].substring(4,6)))/864e5<=3);const m=new Map();for(let i=0;i<D.length;i++){const s=D[i],Ys=[s[4],s[5]],sig=D.filter(x=>x[0]>=s[0]&&x[0]<=String(Number(s[0])+3));sig.forEach(x=>{const X=x[3];Ys.forEach(Y=>{if(Y===X)return;if(!m.has(Y))m.set(Y,new Map());const in=m.get(Y);if(!in.has(X))in.set(X,0);in.set(X,in.get(X)+1)})})}const tY={};D.forEach(s=>{[s[4],s[5]].forEach(Y=>{tY[Y]=(tY[Y]||0)+1})});const aM=new Map();rec.forEach(s=>{[s[4],s[5]].forEach(Y=>{if(aM.has(Y)||!m.has(Y))return;const c=[];const my=m.get(Y);my.forEach((v,X)=>{if(v>=3&&tY[Y]&&(v/tY[Y])>=0.5)c.push({X:X,t:Math.round(v/tY[Y]*100)})});if(c.length){c.sort((a,b)=>b.t-a.t);aM.set(Y,c.slice(0,3))}})});return Array.from(aM.entries()).map(([Y,d])=>({Y:Y,d:d}))}

function rC(){const p=cC();let h="";if(!p.length)h='<div class="alert-warning">⚠️ Sin percutores</div>';else p.forEach(x=>{h+='<div class="signal-card" style="border-color:#a569bd"><div style="display:flex;align-items:center"><span class="number-highlight">'+x.Y+'</span><span style="margin-left:12px">🧲 Percutor</span></div><p style="margin-top:8px">🎯 Anuncia:</p><div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">'+x.d.map(z=>'<code style="background:#1e405b;padding:6px 14px;border-radius:15px">'+z.X+" ("+z.t+"%)</code>").join("")+"</div></div>"});document.getElementById("cC").innerHTML=h}

function cD(){const db=["00","11","22","33","44","55","66","77","88","99"],now=new Date();now.setHours(0,0,0,0);const rec=D.filter(x=>(now-new Date("20"+x[0].substring(0,2)+"-"+x[0].substring(2,4)+"-"+x[0].substring(4,6)))/864e5<=3);const p=new Set();rec.forEach(s=>{[s[3],s[4],s[5]].forEach(v=>{if(db.includes(v))p.add(v)})});return Array.from(p)}

function rD(){const d=cD();let h="";if(!d.length)h='<div class="alert-warning">⚠️ Sin dobles</div>';else d.forEach(x=>{h+='<div class="signal-card" style="border-color:#f4d03f;background:#1e2f1e"><div style="display:flex;align-items:center"><span class="number-highlight">'+x+'</span><span style="margin-left:12px;color:#f4d03f">👁️ DOBLE</span></div><p style="margin-top:8px">⚠️ Se repite en 48h</p></div>'});document.getElementById("cD").innerHTML=h}

function cP(){const aN=getA().map(x=>x.n);if(!aN.length)return null;const pc={};D.forEach(s=>{const pr=[[s[3],s[4]],[s[3],s[5]],[s[4],s[5]]];pr.forEach(p=>{if(aN.includes(p[0])||aN.includes(p[1])){const k=p.join("-");if(!pc[k])pc[k]={c:0,l:{}};pc[k].c++;const lk=s[1]+" "+fmtH(s[2]);pc[k].l[lk]=(pc[k].l[lk]||0)+1}})});return Object.entries(pc).filter(([_,d])=>d.c>=3).sort((a,b)=>b[1].c-a[1].c).slice(0,5).map(([k,d])=>{const ls=Object.entries(d.l).sort((a,b)=>b[1]-a[1]);return{p:k,f:d.c,lf:ls.length?ls[0][0]:"General"}})}

function rP(){const p=cP();const c=document.getElementById("cP");if(!p||!p.length){c.innerHTML='<div class="alert-warning">⚠️ Sin palé</div>';return}let h="";p.forEach(x=>{const n=x.p.split("-");h+='<div class="signal-card" style="border-color:#17a589"><div style="display:flex;align-items:center"><span class="number-highlight" style="font-size:2rem">'+n[0]+'</span><span style="margin:0 12px;font-size:2rem">•</span><span class="number-highlight" style="font-size:2rem">'+n[1]+'</span></div><p style="margin-top:8px">Freq: <strong>'+x.f+"</strong></p><p style='font-size:0.8rem;color:#bcd3f0'>🎯 "+x.lf+"</p></div>"});c.innerHTML=h}

function cR(){const r=new Map();getA().map(x=>x.n).forEach(n=>{if(!r.has(n))r.set(n,{v:[],t:0});r.get(n).v.push("A")});cB().map(x=>x.n).forEach(n=>{if(!r.has(n))r.set(n,{v:[],t:0});r.get(n).v.push("B")});cC().map(x=>x.Y).forEach(n=>{if(!r.has(n))r.set(n,{v:[],t:0});r.get(n).v.push("C")});cD().forEach(n=>{if(!r.has(n))r.set(n,{v:[],t:0});r.get(n).v.push("D")});const res=[];r.forEach((v,n)=>{v.t=v.v.length;if(v.t>=2)res.push({n:n,v:v.v,t:v.t})});res.sort((a,b)=>b.t-a.t||a.n.localeCompare(b.n));return res}

function rR(){const r=cR();const c=document.getElementById("cR");if(!r.length){c.innerHTML='<div class="alert-warning">⏳ Sin respaldo</div>';return}let h="";const ic={A:"🎯",B:"🔥",C:"🧲",D:"💎"};r.forEach(x=>{const is=x.v.map(v=>'<span title="'+v+'">'+ic[v]+"</span>").join(" ");h+='<div class="signal-card" style="border-color:#ffd700;background:#1a2e1a"><div style="display:flex;align-items:center"><span class="number-highlight">'+x.n+'</span><span style="margin-left:12px">⭐ '+is+" ("+x.t+")</span></div></div>"});c.innerHTML=h}

function mc(s,f){const bc=(fm)=>{const e=Object.entries(fm).sort((a,b)=>a[0].localeCompare(b[0])),n=[],c=[];let t=0;for(const[num,cnt]of e){n.push(num);t+=cnt;c.push(t)}return{n:n,c:c,t:t}};const p1=bc(f),pk=(cd)=>{const r=Math.random()*cd.t;let l=0,h=cd.c.length-1;while(l<h){const m=(l+h)>>>1;if(cd.c[m]<r)l=m+1;else h=m}return cd.n[l]},cnt={};for(let i=0;i<s;i++){const p1v=pk(p1);cnt[p1v]=(cnt[p1v]||0)+1}return Object.entries(cnt).map(([n,c])=>({n:n,p:(c/s*100)})).sort((a,b)=>b.p-a.p).slice(0,5)}

function rM(){const c=document.getElementById("cM");c.innerHTML='<p style="text-align:center;color:#ffd966">⏳ Simulando...</p>';setTimeout(()=>{const f={};D.forEach(s=>{f[s[3]]=(f[s[3]]||0)+1});const t10=mc(1e4,f),t20=mc(2e4,f);let h='<div style="display:flex;gap:15px;flex-wrap:wrap"><div style="flex:1;min-width:250px"><h3 style="color:#ffd966">🔹 10k</h3>';t10.forEach(r=>{h+='<div class="signal-card" style="border-color:#17a589"><span class="number-highlight" style="font-size:2rem">'+r.n+'</span> <span>'+r.p.toFixed(2)+"%</span></div>"});h+='</div><div style="flex:1;min-width:250px"><h3 style="color:#ffd966">🔸 20k</h3>';t20.forEach(r=>{h+='<div class="signal-card" style="border-color:#8e44ad"><span class="number-highlight" style="font-size:2rem">'+r.n+'</span> <span>'+r.p.toFixed(2)+"%</span></div>"});h+="</div></div>";const sm=t10[0]&&t20[0]&&t10[0].n===t20[0].n;h+='<p style="margin-top:15px;color:#bcd3f0">📊 <strong>'+(sm?"✅ Converge":"⚠️ Varía")+"</strong></p>";c.innerHTML=h},50)}

function rH(){const tb=document.getElementById("hBody"),sr=[...D].reverse();let h="";sr.slice(0,150).forEach(s=>{const fd="20"+s[0].substring(0,2)+"-"+s[0].substring(2,4)+"-"+s[0].substring(4,6);h+="<tr><td>"+fd+"</td><td>"+tagL(s[1])+"</td><td>"+fmtH(s[2])+"</td><td>"+s[3]+"</td><td>"+s[4]+"</td><td>"+s[5]+"</td></tr>"});tb.innerHTML=h||'<tr><td colspan="6">Sin datos</tr>'}

function rF(){const c=document.getElementById("formU"),hoy=new Date().toISOString().slice(0,10);let html="";H.lot.forEach((s,i)=>{html+='<div class="input-group"><label>'+s.t+'</label><input type="text" id="p1_'+i+'" placeholder="1ª" maxlength="2"><input type="text" id="p2_'+i+'" placeholder="2ª" maxlength="2" style="margin-top:5px"><input type="text" id="p3_'+i+'" placeholder="3ª" maxlength="2" style="margin-top:5px"></div>'});c.innerHTML=html}

document.getElementById("btnGuardar").addEventListener("click",()=>{const hoy=new Date().toISOString().slice(0,10);let ag=0;for(let i=0;i<7;i++){const p1=document.getElementById("p1_"+i)?.value.trim().padStart(2,"0"),p2=document.getElementById("p2_"+i)?.value.trim().padStart(2,"0"),p3=document.getElementById("p3_"+i)?.value.trim().padStart(2,"0");if(!/^\d{2}$/.test(p1)||!/^\d{2}$/.test(p2)||!/^\d{2}$/.test(p3))continue;const s=H.lot[i],ex=D.some(x=>x[0]===hoy.substring(2)&&x[1]===s.l&&x[2]===s.h);if(!ex){D.push([hoy.substring(2),s.l,s.h,p1,p2,p3]);ag++}}if(ag>0){D.sort((a,b)=>(a[0]+a[2]).localeCompare(b[0]+b[2]));rH();rAll();alert("✅ "+ag+" guardados");rF()}else alert("⚠️ Sin cambios")});
document.getElementById("btnLimpiar").addEventListener("click",rF);

function rAll(){rA();rB();rC();rD();rP();rR()}

const tabs=document.querySelectorAll(".tab-btn"),ports=document.querySelectorAll(".portada");
tabs.forEach(t=>t.addEventListener("click",()=>{const id=t.dataset.tab;tabs.forEach(b=>b.classList.remove("active"));ports.forEach(p=>p.classList.remove("active"));t.classList.add("active");document.getElementById(id).classList.add("active");if(id==="H")rH();else if(id==="M")rM()}));
rH();rF();rAll();
console.log("✅ TOTAL:",D.length);
})();
