<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOTO 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#020d18;--card:rgba(4,20,38,0.95);--b:rgba(0,200,255,0.13);--ac:#00c8ff;--go:#ffd700;--gr:#00ff88;--rd:#ff4060;--pu:#b060ff;--or:#ff9944;--tx:#d0eaff;--mu:#5a8099;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);background-image:radial-gradient(ellipse at 10% 0%,rgba(0,100,200,.13),transparent 55%),radial-gradient(ellipse at 90% 85%,rgba(60,0,120,.09),transparent 50%);min-height:100vh;font-family:'Exo 2',sans-serif;color:var(--tx);padding:10px;}
.app{max-width:860px;margin:0 auto;}
.hdr{text-align:center;padding:14px 0 6px;}
.logo{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2.6rem);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#00c8ff,#fff,#ffd700,#00ff88,#00c8ff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;}
@keyframes sh{to{background-position:300% center;}}
.clk{display:inline-flex;align-items:center;margin-top:6px;background:rgba(0,200,255,.07);border:1px solid var(--b);border-radius:50px;padding:5px 15px;font-family:'Share Tech Mono',monospace;color:var(--go);font-size:.78rem;}
.sbar{display:flex;justify-content:center;gap:7px;margin:6px 0;flex-wrap:wrap;}
.pill{padding:3px 11px;border-radius:20px;font-size:.68rem;font-weight:700;font-family:'Share Tech Mono',monospace;}
.pill.ok{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.4);color:var(--gr);}
.pill.par{background:rgba(255,153,68,.1);border:1px solid rgba(255,153,68,.4);color:var(--or);}
.pill.pend{background:rgba(255,64,96,.1);border:1px solid rgba(255,64,96,.3);color:var(--rd);}
.tabs{display:flex;gap:5px;justify-content:center;margin:10px 0 8px;border-bottom:1px solid var(--b);padding-bottom:8px;flex-wrap:wrap;}
.tb{background:transparent;border:1px solid rgba(0,200,255,.17);padding:9px 15px;font-size:.8rem;font-weight:700;color:var(--mu);border-radius:8px;cursor:pointer;transition:.2s;font-family:'Exo 2',sans-serif;}
.tb:hover{color:var(--ac);border-color:var(--ac);}
.tb.on{background:linear-gradient(135deg,rgba(0,200,255,.14),rgba(0,100,200,.07));color:var(--ac);border-color:var(--ac);box-shadow:0 0 12px rgba(0,200,255,.16);}
.pg{display:none;animation:fi .3s ease;}.pg.on{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.ctit{font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700;color:var(--go);letter-spacing:2px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--b);}

/* QUÉ HAGO HOY */
.qhh{border-radius:14px;padding:16px;margin-bottom:10px;}
.qhh.jugar{background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,200,255,.04));border:2px solid rgba(0,255,136,.4);}
.qhh.esperar{background:rgba(255,153,68,.06);border:1px solid rgba(255,153,68,.35);}
.qhh.nojugar{background:rgba(255,64,96,.06);border:1px solid rgba(255,64,96,.3);}
.qhh-icon{font-size:1.6rem;margin-bottom:6px;}
.qhh-num{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;display:inline-block;padding:2px 12px;border-radius:8px;margin:0 6px;}
.qhh-num.j{color:var(--go);background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.25);}
.qhh-num.e{color:var(--or);background:rgba(255,153,68,.06);border:1px solid rgba(255,153,68,.22);}
.qhh-num.n{color:var(--rd);background:rgba(255,64,96,.06);border:1px solid rgba(255,64,96,.22);}
.qhh-main{font-size:1rem;font-weight:800;margin-bottom:4px;}
.qhh-sub{font-size:.8rem;color:var(--mu);line-height:1.6;}
.qhh-dest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.lp{display:inline-block;padding:5px 11px;border-radius:8px;font-size:.76rem;font-weight:700;font-family:'Share Tech Mono',monospace;}
.lp.ga{background:#c41e3a22;color:#ff6680;border:1px solid #c41e3a44;}
.lp.fl{background:#ff6b3522;color:#ffaa77;border:1px solid #ff6b3544;}
.lp.ny{background:#4169e122;color:#88aaff;border:1px solid #4169e144;}
.nojugar-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center;}
.njlp{display:inline-block;padding:3px 9px;border-radius:6px;font-size:.7rem;font-family:'Share Tech Mono',monospace;background:rgba(255,64,96,.07);border:1px solid rgba(255,64,96,.22);color:#ff8fa0;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,.13),transparent);margin:12px 0;}

/* PRONÓSTICO DETALLE */
.pc{border-radius:14px;padding:16px;margin-bottom:13px;}
.pc.A{background:linear-gradient(135deg,rgba(255,215,0,.09),rgba(255,153,68,.05));border:2px solid rgba(255,215,0,.45);}
.pc.B{background:linear-gradient(135deg,rgba(0,200,255,.07),rgba(0,100,200,.04));border:1px solid rgba(0,200,255,.32);}
.pc.C{background:rgba(176,96,255,.05);border:1px solid rgba(176,96,255,.25);}
.nd{font-family:'Orbitron',monospace;font-size:2.5rem;font-weight:900;display:inline-block;min-width:72px;text-align:center;padding:4px 12px;border-radius:10px;}
.nd.A{color:var(--go);text-shadow:0 0 24px rgba(255,215,0,.45);background:rgba(255,215,0,.05);border:1px solid rgba(255,215,0,.25);}
.nd.B{color:var(--ac);text-shadow:0 0 20px rgba(0,200,255,.35);background:rgba(0,200,255,.05);border:1px solid rgba(0,200,255,.2);}
.nd.C{color:var(--pu);background:rgba(176,96,255,.05);border:1px solid rgba(176,96,255,.2);}
.nlbl{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.68rem;font-weight:900;font-family:'Share Tech Mono',monospace;}
.nlbl.A{background:rgba(255,215,0,.13);border:1px solid rgba(255,215,0,.38);color:var(--go);}
.nlbl.B{background:rgba(0,200,255,.11);border:1px solid rgba(0,200,255,.28);color:var(--ac);}
.nlbl.C{background:rgba(176,96,255,.09);border:1px solid rgba(176,96,255,.23);color:var(--pu);}
.jbox{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.2);border-radius:10px;padding:10px 13px;margin-top:9px;}
.jtit{font-size:.68rem;color:var(--gr);font-weight:700;margin-bottom:6px;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
.jrow{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap;}
.njbox{background:rgba(255,64,96,.05);border:1px solid rgba(255,64,96,.2);border-radius:8px;padding:8px 12px;margin-top:7px;}
.njtit{font-size:.68rem;color:var(--rd);font-weight:700;margin-bottom:4px;font-family:'Share Tech Mono',monospace;}
.sr{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.66rem;font-family:'Share Tech Mono',monospace;background:rgba(0,200,255,.05);border:1px solid rgba(0,200,255,.12);color:var(--mu);}
.st.go{background:rgba(255,215,0,.05);border-color:rgba(255,215,0,.16);color:var(--go);}
.st.gr{background:rgba(0,255,136,.05);border-color:rgba(0,255,136,.16);color:var(--gr);}
.st.or{background:rgba(255,153,68,.05);border-color:rgba(255,153,68,.16);color:var(--or);}
.st.rd{background:rgba(255,64,96,.05);border-color:rgba(255,64,96,.16);color:var(--rd);}
.st.pu{background:rgba(176,96,255,.05);border-color:rgba(176,96,255,.16);color:var(--pu);}
.imbox{background:rgba(0,10,25,.5);border-left:3px solid var(--pu);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:.71rem;font-family:'Share Tech Mono',monospace;line-height:1.5;}
.imbox.cerca{border-color:var(--gr);}
.imbox.viaje{border-color:var(--ac);}
.imbox.inicio{border-color:var(--or);}
.evl{margin-top:8px;font-size:.68rem;font-family:'Share Tech Mono',monospace;color:var(--mu);}
.evl span{display:block;padding:2px 0;border-bottom:1px solid rgba(0,200,255,.05);}
.njtotal{background:rgba(255,64,96,.06);border:2px solid rgba(255,64,96,.32);border-radius:14px;padding:26px;text-align:center;}
.njtotal h2{font-family:'Orbitron',monospace;font-size:1.2rem;color:var(--rd);letter-spacing:3px;margin-bottom:10px;}
.njtotal p{color:#ff8fa0;font-size:.83rem;line-height:1.7;}
.apr-e{border-left:3px solid var(--pu);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-family:'Share Tech Mono',monospace;font-size:.7rem;background:rgba(0,10,25,.6);}
.apr-e.ok{border-color:var(--gr);}
.apr-e.fail{border-color:var(--rd);}
.apr-e.pat{border-color:var(--go);}
table{width:100%;border-collapse:collapse;font-size:.78rem;}
th{background:rgba(0,200,255,.07);color:var(--ac);padding:8px;text-align:left;font-size:.72rem;position:sticky;top:0;z-index:1;}
td{padding:7px 8px;border-bottom:1px solid rgba(0,200,255,.05);}
tr:hover td{background:rgba(0,200,255,.03);}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;}
.ig{background:rgba(0,200,255,.04);border:1px solid var(--b);border-radius:10px;padding:9px;}
.ig label{display:block;color:var(--go);font-size:.68rem;font-weight:700;margin-bottom:4px;}
.ig input{width:100%;padding:7px;border-radius:6px;border:1px solid var(--b);background:rgba(0,10,30,.7);color:white;font-family:'Share Tech Mono',monospace;text-align:center;margin-top:2px;font-size:.88rem;}
.btn-g{background:linear-gradient(145deg,#f3c84e,#c99d1e);border:none;padding:12px 26px;border-radius:8px;font-family:'Exo 2',sans-serif;font-weight:800;font-size:.9rem;color:#0a1c2c;cursor:pointer;box-shadow:0 4px 0 #7a5c00;}
.btn-g:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5c00;}
.btn-o{background:transparent;border:1px solid var(--b);color:var(--mu);padding:11px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.84rem;}
.btn-o:hover{border-color:var(--ac);color:var(--ac);}
.wbox{background:rgba(255,153,68,.07);border:1px solid rgba(255,153,68,.28);border-radius:10px;padding:10px;color:var(--or);margin-bottom:10px;font-size:.78rem;}
@media(max-width:480px){.nd{font-size:1.9rem;min-width:58px;}.qhh-num{font-size:1.6rem;}}

</head>

</div>

    <div style="display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;">
      <select id="fL" style="background:rgba(0,10,30,.8);border:1px solid var(--b);color:var(--tx);padding:5px 8px;border-radius:6px;font-size:.78rem;">

      <button class="btn-o" onclick="renderHist()" style="padding:5px 10px;font-size:.74rem;">Filtrar</button>

    <div style="max-height:540px;overflow-y:auto;">
      <table><thead><tr><th>Fecha</th><th>Lotería</th><th>Hora</th><th>1ª</th><th>2ª</th><th>3ª</th></tr></thead>
      <tbody id="hBody"></tbody></table>
    </div>
  </div>
</div>
<div id="act" class="pg">
  <div class="card">
    <div class="ctit">🔄 ACTUALIZAR SORTEOS</div>
    <div id="wAct" class="wbox" style="display:none;"></div>
    <div class="fgrid" id="fAct"></div>
    <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
      <button class="btn-g" id="btnS">💾 Guardar y Recalcular</button>
      <button class="btn-o" id="btnC">🧹 Limpiar</button>
    </div>
  </div>
</div>
<div id="apr" class="pg">
  <div class="card">
    <div class="ctit">📚 BITÁCORA DE APRENDIZAJE</div>
    <div id="cApr"></div>
  </div>
</div>
</div>

function fH(h){if(!h)return'';const[hh,mm]=h.split(':');let hr=parseInt(hh);const ap=hr>=12?'PM':'AM';if(hr>12)hr-=12;if(hr===0)hr=12;return`${hr}:${mm} ${ap}`;}
function bL(l){const c={GEORGIA:'ga',FLORIDA:'fl',NY:'ny'};return`<span class="lp ${c[l]||''}">${l}</span>`;}
function crn(){return[...sorteos].sort((a,b)=>(a.fecha+'T'+a.horario).localeCompare(b.fecha+'T'+b.horario));}
function dS(f){return new Date(f+'T12:00:00').getDay();}
function getUF(){const c=crn();return c.length?c[c.length-1].fecha:null;}

function getFP(){
  const t=crn();const uf=getUF();
  if(!uf)return{fecha:null,jug:new Set(),ds:0,dn:'?'};
  const del=t.filter(s=>s.fecha===uf);
  const jug=new Set(del.map(s=>s.loteria+'|'+s.horario.slice(0,4)));
  if(jug.size>=7){
    const d=new Date(uf+'T12:00:00');d.setDate(d.getDate()+1);
    const man=d.toISOString().slice(0,10);
    const jM=new Set(t.filter(s=>s.fecha===man).map(s=>s.loteria+'|'+s.horario.slice(0,4)));
    return{fecha:man,jug:jM,ds:d.getDay(),dn:DIAS[d.getDay()]};
  }
  return{fecha:uf,jug,ds:new Date(uf+'T12:00:00').getDay(),dn:DIAS[dS(uf)]};
}

function cicConsum(num,t){
  const u1=[...t].reverse().find(s=>s.p1===num);
  const u23=[...t].reverse().find(s=>s.p2===num||s.p3===num);
  if(!u1||!u23)return false;
  return(u1.fecha+'T'+u1.horario)>(u23.fecha+'T'+u23.horario);
}

function analizar(num,t){
  const tr=[];let t23=0;
  for(let i=0;i<t.length;i++){
    if(t[i].p2!==num&&t[i].p3!==num)continue;
    const pos=t[i].p2===num?'2ª':'3ª';
    t23++;let is=0,i23=0,ac=[];
    for(let j=i+1;j<t.length&&j<=i+20;j++){
      const s=t[j];
      const dd=(new Date(s.fecha+'T12:00:00')-new Date(t[i].fecha+'T12:00:00'))/86400000;
      if(dd>6)break;
      if(s.p1===num){
        tr.push({pos,lotO:t[i].loteria,hO:t[i].horario,fO:t[i].fecha,dO:dS(t[i].fecha),
                 lotD:s.loteria,hD:s.horario,fD:s.fecha,dD:dS(s.fecha),
                 saltos:j-i,dias:dd,is,i23,ac:ac.slice(0,3)});
        break;
      }
      if(s.p2===num||s.p3===num)i23++;else is++;
      ac.push(s.p1);
    }
  }
  if(!tr.length)return null;
  const tasa=Math.round(tr.length/t23*100);
  const sal=tr.map(x=>x.saltos);
  const imp=tr.map(x=>x.is);
  const sp=(sal.reduce((a,b)=>a+b,0)/sal.length).toFixed(1);
  const ip=(imp.reduce((a,b)=>a+b,0)/imp.length).toFixed(1);
  const dC={};tr.forEach(x=>{const k=x.lotD+'|'+x.hD.slice(0,5);dC[k]=(dC[k]||0)+1;});
  const dTop=Object.entries(dC).sort((a,b)=>b[1]-a[1]);
  const rC={};tr.forEach(x=>{const k=x.lotO+'→'+x.lotD;rC[k]=(rC[k]||0)+1;});
  const rTop=Object.entries(rC).sort((a,b)=>b[1]-a[1])[0];
  const dAC={};tr.forEach(x=>{dAC[x.dO]=(dAC[x.dO]||0)+1;});
  const dAT=Object.entries(dAC).sort((a,b)=>b[1]-a[1])[0];
  const dDC={};tr.forEach(x=>{dDC[x.dD]=(dDC[x.dD]||0)+1;});
  const dDT=Object.entries(dDC).sort((a,b)=>b[1]-a[1])[0];
  const reap=tr.filter(x=>x.i23>0).length;
  return{tr,t23,tasa,sp,ip,smin:Math.min(...sal),smax:Math.max(...sal),
         imin:Math.min(...imp),imax:Math.max(...imp),dTop,
         ruta:rTop?.[0]||'?',diaAct:DIAS[parseInt(dAT?.[0]||0)],
         diaCae:DIAS[parseInt(dDT?.[0]||0)],reap,pReap:Math.round(reap/tr.length*100)};
}

function impasActual(num,t,ult){
  const idx=t.findIndex(s=>s.fecha===ult.fecha&&s.loteria===ult.lot&&s.horario===ult.h);
  if(idx<0)return null;
  let sp=0,reap=0;
  for(let j=idx+1;j<t.length;j++){
    if(t[j].p1===num)return{consumido:true};
    if(t[j].p2===num||t[j].p3===num)reap++;else sp++;
  }
  return{consumido:false,sp,reap,rebota:reap>0};
}

function calcDia(num,ds,t){
  const dd=t.filter(s=>dS(s.fecha)===ds);
  const en=dd.filter(s=>s.p1===num).length;
  const g=t.filter(s=>s.p1===num).length/t.length;
  const d=dd.length>0?en/dd.length:0;
  return{pD:(d*100).toFixed(1),pG:(g*100).toFixed(1),v:(g>0?d/g:0).toFixed(2)};
}

function calcPerc(num,t){
  let v=0;for(let i=1;i<t.length;i++){if(t[i].p1!==num)continue;const p=t[i-1];if(p.p2||p.p3)v++;}
  return v;
}

function getCandidatos(){
  const t=crn();const fp=getFP();const uf=getUF();
  if(!uf)return{cands:[],fp};
  const fechas=[...new Set(t.map(s=>s.fecha))].sort();
  const idx=fechas.indexOf(uf);
  const vent=fechas.slice(Math.max(0,idx-2),idx+1);
  const cm=new Map();
  t.filter(s=>vent.includes(s.fecha)).forEach(s=>{
    ['p2','p3'].forEach((p,pi)=>{
      const v=s[p];if(!v)return;
      const pos=pi===0?'2ª':'3ª';
      if(!cm.has(v)||cm.get(v).fecha+cm.get(v).h<s.fecha+s.horario)
        cm.set(v,{fecha:s.fecha,h:s.horario,lot:s.loteria,pos});
    });
  });
  const res=[];
  cm.forEach((ult,num)=>{
    if(cicConsum(num,t))return;
    const an=analizar(num,t);
    if(!an||an.t23<5||an.tr.length<2)return;
    const imp=impasActual(num,t,ult);
    if(imp&&imp.consumido)return;
    const jugar=an.dTop.filter(([k])=>{const[l,h]=k.split('|');return!fp.jug.has(l+'|'+h.slice(0,4));});
    const noJugar=an.dTop.filter(([k])=>{const[l,h]=k.split('|');return fp.jug.has(l+'|'+h.slice(0,4));});
    const dia=calcDia(num,fp.ds,t);
    const perc=calcPerc(num,t);
    const sArr=an.tasa*2.2*pesos.arr;
    const sDia=parseFloat(dia.v)*9*pesos.dia;
    const sPerc=Math.min(perc/60*18,18)*pesos.perc;
    const sJ=jugar.length>0?10:0;
    const pen=an.pReap>40?-12:an.pReap>25?-6:0;
    const score=sArr+sDia+sPerc+sJ+pen;
    let niv='C';
    if(an.tasa>=25&&jugar.length>0&&an.pReap<=25)niv='A';
    else if(an.tasa>=18&&jugar.length>0)niv='B';
    res.push({num,ult,an,imp,jugar,noJugar,tot:an.dTop.reduce((a,[,v])=>a+v,0),
              dia,perc,niv,score:score.toFixed(1)});
  });
  res.sort((a,b)=>parseFloat(b.score)-parseFloat(a.score));
  return{cands:res.slice(0,4),fp};
}

function renderHoy(){
  const{cands,fp}=getCandidatos();
  document.getElementById('hoyTit').textContent=`💡 ¿QUÉ HAGO HOY? — ${fp.dn||'?'} ${fp.fecha||''}`;
  if(!cands.length){
    document.getElementById('cHoy').innerHTML=`<div class="njtotal">
      <h2>🚫 NO JUGAR HOY</h2>
      <p>Sin señales activas con evidencia suficiente.<br>
      Actualiza los sorteos del día para recalcular.</p></div>`;
    ultPronos=null;return;
  }
  ultPronos=cands.map(c=>({num:c.num,niv:c.niv,
    destLot:c.jugar.length>0?c.jugar[0][0].split('|')[0]:null,fecha:fp.fecha}));

  let html='';
  cands.forEach((c,idx)=>{
    const imp=c.imp;
    const tot=c.tot||1;
    // Decidir acción
    let accion,tipo,icono;
    const impasPct=imp?parseFloat(c.an.ip)>0?imp.sp/parseFloat(c.an.ip):0:0;
    if(c.jugar.length===0){
      accion='esperar'; tipo='esperar'; icono='⏳';
    } else if(c.niv==='A'&&!imp?.rebota){
      accion='jugar'; tipo='jugar'; icono='✅';
    } else if(c.niv==='B'&&impasPct>=0.7){
      accion='jugar'; tipo='jugar'; icono='✅';
    } else if(imp&&imp.sp<parseFloat(c.an.ip)*0.5){
      accion='esperar'; tipo='esperar'; icono='⏳';
    } else if(imp?.rebota){
      accion='precaución'; tipo='esperar'; icono='⚠️';
    } else {
      accion='jugar'; tipo='jugar'; icono='✅';
    }

    html+=`<div class="qhh ${tipo}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
        <span style="font-size:1.5rem;">${icono}</span>
        <span class="qhh-num ${tipo==='jugar'?'j':'e'}">${c.num}</span>
        <div>
          <div class="qhh-main" style="color:${tipo==='jugar'?'var(--gr)':tipo==='esperar'?'var(--or)':'var(--rd)'};">
            ${tipo==='jugar'?'JUGAR':tipo==='esperar'?'ESPERAR — aún en tránsito':'PRECAUCIÓN — rebotando'}
          </div>
          <div style="font-size:.75rem;color:var(--mu);">
            Última: ${c.ult.pos} · ${c.ult.lot} ${fH(c.ult.h)} · ${c.ult.fecha}
          </div>
        </div>
      </div>

      ${tipo==='jugar'&&c.jugar.length>0?`
      <div style="font-size:.76rem;color:var(--gr);font-weight:700;margin-bottom:5px;">🎯 Jugar en:</div>
      <div class="qhh-dest">
        ${c.jugar.slice(0,2).map(([k,v])=>{
          const[l,h]=k.split('|');const pct=Math.round(v/tot*100);
          const lc={GEORGIA:'ga',FLORIDA:'fl',NY:'ny'};
          return`<span class="lp ${lc[l]||''}" style="font-size:.82rem;">${l} ${fH(h)} <span style="opacity:.7;">(${v}x · ${pct}%)</span></span>`;
        }).join('')}
      </div>`:''}

      ${tipo==='esperar'&&imp?`
      <div style="font-size:.78rem;color:var(--or);margin-top:4px;">
        ⏸ Lleva ${imp.sp} sorteos de silencio — prom histórico: ${c.an.ip} sorteos
        ${imp.rebota?'<br>⚠️ Reapareció en 2ª/3ª — puede tardar más':''}
        ${imp.sp>=parseFloat(c.an.ip)?'<br>🟢 Ya está en zona de activación':''}
      </div>`:''}

      ${c.noJugar.length>0?`
      <div class="nojugar-row">
        <span style="font-size:.68rem;color:var(--rd);">🚫 No jugar:</span>
        ${c.noJugar.slice(0,3).map(([k])=>{const[l,h]=k.split('|');return`<span class="njlp">${l} ${fH(h)}</span>`;}).join('')}
      </div>`:''}

      ${idx<cands.length-1?'<div class="divider"></div>':''}
    </div>`;
  });

  // Resumen global al final
  const paraJugar=cands.filter(c=>{
    const imp=c.imp;const impasPct=imp?imp.sp/Math.max(parseFloat(c.an.ip),1):0;
    return c.jugar.length>0&&(c.niv==='A'||(c.niv==='B'&&impasPct>=0.7));
  });
  const enTransito=cands.filter(c=>c.jugar.length>0&&!paraJugar.includes(c));

  html+=`<div style="background:rgba(0,10,25,.6);border:1px solid var(--b);border-radius:12px;padding:14px;margin-top:4px;">
    <div style="font-size:.72rem;color:var(--mu);margin-bottom:8px;font-family:'Share Tech Mono',monospace;">📋 RESUMEN DEL DÍA</div>
    ${paraJugar.length>0?`<div style="color:var(--gr);font-size:.82rem;margin-bottom:4px;">✅ Para jugar: ${paraJugar.map(c=>`<strong>${c.num}</strong>`).join(', ')}</div>`:''}
    ${enTransito.length>0?`<div style="color:var(--or);font-size:.82rem;margin-bottom:4px;">⏳ En tránsito (esperar): ${enTransito.map(c=>`<strong>${c.num}</strong>`).join(', ')}</div>`:''}
    ${paraJugar.length===0&&enTransito.length===0?`<div style="color:var(--rd);font-size:.82rem;">🚫 Hoy no hay señal clara — mejor no jugar</div>`:''}
  </div>`;

  document.getElementById('cHoy').innerHTML=html;
}

// ── PRONÓSTICOS DETALLADOS ──
function renderProno(){
  const{cands,fp}=getCandidatos();
  document.getElementById('pronoTit').textContent=`🎯 PRONÓSTICOS — ${fp.dn||'?'} ${fp.fecha||''}`;
  if(!cands.length){
    document.getElementById('cProno').innerHTML=`<div class="njtotal"><h2>🚫 NO JUGAR HOY</h2><p>Sin candidatos con evidencia suficiente.</p></div>`;
    return;
  }
  let html='';
  cands.forEach(c=>{
    const N=c.niv;
    const imp=c.imp;
    const tot=c.tot||1;
    const impasPct=imp&&parseFloat(c.an.ip)>0?imp.sp/parseFloat(c.an.ip):0;
    let impFase='',impCls='viaje';
    if(imp&&!imp.consumido){
      if(impasPct<0.4){impFase=`🟡 Inicio del impás — ${imp.sp} sorteos (esperar, prom ${c.an.ip})`;impCls='inicio';}
      else if(impasPct<0.8){impFase=`🟠 Viajando — ${imp.sp} sort. de ${c.an.ip} prom`;impCls='viaje';}
      else{impFase=`🟢 Zona de activación — ${imp.sp} sort. (${Math.round(impasPct*100)}% del ciclo completado)`;impCls='cerca';}
      if(imp.rebota)impFase+=`<br><span style="color:var(--or);">⚠️ Reapareció en 2ª/3ª ${imp.reap}x — puede demorar más</span>`;
    }

    html+=`<div class="pc ${N}">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <span class="nd ${N}">${c.num}</span>
        <div>
          <span class="nlbl ${N}">${N==='A'?'🔥 FUERTE':N==='B'?'⚡ MEDIA':'📊 DÉBIL'}</span>
          <div style="margin-top:5px;font-size:.7rem;color:var(--mu);">
            Última: ${c.ult.pos} · ${bL(c.ult.lot)} ${fH(c.ult.h)} · ${c.ult.fecha}
          </div>
        </div>
      </div>
      <div class="sr">
        <span class="st go">📊 Arrastre ${c.an.tasa}% — ${c.an.tr.length}/${c.an.t23} casos</span>
        <span class="st ${parseFloat(c.dia.v)>=2?'gr':parseFloat(c.dia.v)>=1.2?'or':''}">📅 ${fp.dn} ${c.dia.pD}% (${c.dia.v}x prom)</span>
        <span class="st pu">🧲 Percutado ${c.perc}x</span>
        <span class="st">⏱ Salto: prom ${c.an.sp} (${c.an.smin}-${c.an.smax} sort.)</span>
        <span class="st ${c.an.pReap>40?'rd':c.an.pReap>25?'or':'gr'}">🔁 Rebote ${c.an.pReap}% ${c.an.pReap>40?'⚠️ riesgo':''}</span>
        <span class="st or">📅 Se activa ${c.an.diaAct} → cae ${c.an.diaCae}</span>
        <span class="st">🛣 Ruta: ${c.an.ruta}</span>
      </div>
      ${impFase?`<div class="imbox ${impCls}">${impFase}</div>`:''}
      ${c.jugar.length>0?`<div class="jbox">
        <div class="jtit">🎯 JUGAR EN — ordenado por evidencia:</div>
        ${c.jugar.slice(0,3).map(([k,v])=>{
          const[l,h]=k.split('|');const pct=Math.round(v/tot*100);
          return`<div class="jrow">${bL(l)} <strong style="font-family:'Share Tech Mono',monospace;">${fH(h)}</strong>
            <span style="color:var(--gr);font-size:.68rem;">${v}x comprobado · ${pct}% de los tránsitos</span></div>`;
        }).join('')}
      </div>`:`<div class="njbox"><div class="njtit">🚫 Todos los horarios ya se jugaron hoy</div></div>`}
      ${c.noJugar.length>0?`<div class="njbox">
        <div class="njtit">🚫 NO JUGAR EN:</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${c.noJugar.slice(0,3).map(([k])=>{const[l,h]=k.split('|');return`${bL(l)}<span style="font-family:'Share Tech Mono',monospace;font-size:.7rem;"> ${fH(h)}</span>`;}).join('')}</div>
      </div>`:''}
      <div class="divider"></div>
      <div class="evl">
        <span style="color:var(--mu);font-size:.63rem;display:block;margin-bottom:3px;">📋 Últimas evidencias comprobadas:</span>
        ${c.an.tr.slice(-3).map(e=>`<span>📌 ${e.fO} ${bL(e.lotO)} ${e.pos} → ${e.saltos}sort (${e.is}impás) → ${bL(e.lotD)} ${fH(e.hD)} ${DIAS[e.dD]}</span>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('cProno').innerHTML=html;
}

// ── HISTORIAL ──
function renderHist(){
  const fLv=document.getElementById('fL')?.value||'';
  const fFv=document.getElementById('fF')?.value||'';
  let d=[...sorteos].sort((a,b)=>(b.fecha+'T'+b.horario).localeCompare(a.fecha+'T'+a.horario));
  if(fLv)d=d.filter(s=>s.loteria===fLv);
  if(fFv)d=d.filter(s=>s.fecha===fFv);
  const lc={GEORGIA:'ga',FLORIDA:'fl',NY:'ny'};
  document.getElementById('hBody').innerHTML=d.slice(0,500).map(s=>`<tr>
    <td>${s.fecha}</td><td>${bL(s.loteria)}</td>
    <td style="font-family:'Share Tech Mono',monospace;">${fH(s.horario)}</td>
    <td><strong style="color:var(--go);font-family:'Share Tech Mono',monospace;">${s.p1}</strong></td>
    <td style="font-family:'Share Tech Mono',monospace;">${s.p2}</td>
    <td style="font-family:'Share Tech Mono',monospace;">${s.p3}</td>
  </tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--mu)">Sin resultados</td></tr>';
}

// ── ESTADO BAR ──
function renderSbar(){
  const uf=getUF();if(!uf){document.getElementById('sbar').innerHTML='';return;}
  const del=sorteos.filter(s=>s.fecha===uf);
  const comp=SD.filter(e=>del.some(s=>s.loteria===e.l&&s.horario.startsWith(e.h.slice(0,4)))).length;
  const pend=7-comp;const cls=comp===7?'ok':comp>0?'par':'pend';
  const fp=getFP();
  document.getElementById('sbar').innerHTML=
    `<span class="pill ${cls}">📅 ${uf} · ${DIAS[dS(uf)]}</span>`+
    `<span class="pill ${cls}">${comp}/7</span>`+
    (pend>0?`<span class="pill pend">⏳ ${pend} pendientes</span>`:'')+
    (comp>=7?`<span class="pill ok">🎯 ${fp.fecha} · ${fp.dn}</span>`:'');
}

// ── APRENDIZAJE ──
function evaluar(){
  if(!ultPronos||!ultPronos.length)return;
  const t=crn();const uf=getUF();
  ultPronos.forEach(p=>{
    const rec=t.filter(s=>s.fecha>=p.fecha&&s.fecha<=uf);
    const acerto=rec.some(s=>s.p1===p.num);
    const acLot=acerto&&p.destLot&&rec.filter(s=>s.p1===p.num).some(s=>s.loteria===p.destLot);
    let tipo,cod,msg;
    if(acerto&&acLot){tipo='ok';cod=`✅ ${p.num} acertó lotería`;msg=`${p.num} cayó en 1ª en ${p.destLot} — pronóstico correcto.`;pesos.arr=Math.min(pesos.arr*1.04,2.0);}
    else if(acerto){tipo='ok';cod=`⚠️ ${p.num} acertó número`;msg=`${p.num} cayó en 1ª pero en otra lotería.`;pesos.dia=Math.min(pesos.dia*1.02,2.0);}
    else{tipo='fail';cod=`❌ ${p.num} falló`;msg=`${p.num} no cayó en 1ª. Nivel ${p.niv}.`;pesos.arr=Math.max(pesos.arr*0.97,0.5);}
    bitacora.unshift({fecha:uf,tipo,cod,msg,pesos:{...pesos},ts:Date.now()});
  });
  const t2=crn();
  if(t2.length>=2){const u=t2.slice(-2);if(u[0].p1===u[1].p1)bitacora.unshift({fecha:uf,tipo:'pat',cod:`🔍 ${u[0].p1} consecutivo`,msg:`${u[0].p1} en 1ª dos sorteos seguidos (${u[0].loteria}→${u[1].loteria}).`,pesos:{...pesos},ts:Date.now()});}
  if(bitacora.length>150)bitacora=bitacora.slice(0,150);
}

function renderApr(){
  const ok=bitacora.filter(b=>b.tipo==='ok').length;
  const fail=bitacora.filter(b=>b.tipo==='fail').length;
  const pat=bitacora.filter(b=>b.tipo==='pat').length;
  const tot=ok+fail;
  let html=`<div style="background:rgba(176,96,255,.07);border:1px solid rgba(176,96,255,.2);border-radius:10px;padding:12px;margin-bottom:12px;">
    <div style="font-size:.74rem;color:var(--pu);font-weight:700;margin-bottom:7px;">⚖️ PESOS ACTUALES</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;">${Object.entries(pesos).map(([k,v])=>`<span class="st pu">${k}: ${v.toFixed(3)}</span>`).join('')}</div>
  </div>
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;">
    <span class="st gr">✅ ${ok} aciertos</span><span class="st rd">❌ ${fail} fallos</span>
    <span class="st go">🔍 ${pat} patrones</span>
    ${tot>0?`<span class="st">📊 ${Math.round(ok/tot*100)}% precisión</span>`:''}
  </div>`;
  html+=bitacora.length?bitacora.slice(0,60).map(b=>`<div class="apr-e ${b.tipo}">
    <span style="color:var(--mu);font-size:.63rem;">${b.fecha} · ${b.cod}</span>
    <div style="margin-top:3px;font-size:.71rem;">${b.msg}</div>
  </div>`).join(''):'<div class="wbox">📭 Sin entradas aún. Se llena al actualizar sorteos.</div>';
  document.getElementById('cApr').innerHTML=html;
}

// ── FORM ──
function renderForm(){
  const hoy=new Date().toISOString().slice(0,10);
  const hay=sorteos.filter(s=>s.fecha===hoy);
  const falt=SD.filter(e=>!hay.some(s=>s.loteria===e.l&&s.horario.startsWith(e.h.slice(0,4))));
  const w=document.getElementById('wAct');
  if(falt.length>0&&falt.length<7){w.style.display='block';w.innerHTML=`⚠️ ${hoy}: ${7-falt.length}/7 — Faltan: ${falt.map(f=>f.lb).join(', ')}`;}
  else w.style.display='none';
  document.getElementById('fAct').innerHTML=SD.map((sd,i)=>{
    const ya=hay.find(s=>s.loteria===sd.l&&s.horario.startsWith(sd.h.slice(0,4)));
    return`<div class="ig" style="${ya?'opacity:.62;':''}">
      <label>${sd.lb} ${ya?'<span style="color:var(--gr)">✅</span>':''}</label>
      <input type="text" id="p1_${i}" placeholder="1ª" maxlength="2" value="${ya?.p1||''}">
      <input type="text" id="p2_${i}" placeholder="2ª" maxlength="2" style="margin-top:4px;" value="${ya?.p2||''}">
      <input type="text" id="p3_${i}" placeholder="3ª" maxlength="2" style="margin-top:4px;" value="${ya?.p3||''}">
    </div>`;
  }).join('');
}

document.getElementById('btnS').addEventListener('click',()=>{
  const hoy=new Date().toISOString().slice(0,10);
  let ag=0;
  SD.forEach((sd,i)=>{
    const p1=document.getElementById(`p1_${i}`)?.value.trim().padStart(2,'0');
    const p2=document.getElementById(`p2_${i}`)?.value.trim().padStart(2,'0');
    const p3=document.getElementById(`p3_${i}`)?.value.trim().padStart(2,'0');
    if(!/^\d{2}$/.test(p1)||!/^\d{2}$/.test(p2)||!/^\d{2}$/.test(p3))return;
    if(p1==='00'&&p2==='00'&&p3==='00')return;
    if(!sorteos.some(s=>s.fecha===hoy&&s.loteria===sd.l&&s.horario.startsWith(sd.h.slice(0,4)))){
      sorteos.push({fecha:hoy,loteria:sd.l,horario:sd.h,p1,p2,p3});ag++;
    }
  });
  if(ag>0){
    sorteos.sort((a,b)=>(a.fecha+'T'+a.horario).localeCompare(b.fecha+'T'+b.horario));
    evaluar();sv();renderHoy();renderProno();renderHist();renderForm();renderSbar();
    alert(`✅ ${ag} sorteos guardados. Sistema recalculado.`);
  }else alert('Sin nuevos datos.');
});
document.getElementById('btnC').addEventListener('click',renderForm);

document.querySelectorAll('.tb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');const tab=btn.dataset.tab;
    document.getElementById(tab).classList.add('on');
    if(tab==='hoy')renderHoy();
    if(tab==='prono')renderProno();
    if(tab==='hist')renderHist();
    if(tab==='act')renderForm();
    if(tab==='apr')renderApr();
  });
});

setInterval(()=>{const d=new Date();document.getElementById('clk').textContent=d.toLocaleDateString('es-ES',{weekday:'short',year:'numeric',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);

renderSbar();renderHoy();renderProno();renderHist();renderForm();renderApr();
</script>
</body>
</html>
