  <style>

      background: radial-gradient(circle at 20% 30%, #0b1c2f, #051018);

    .logo { font-size:4rem; font-weight:900; background: linear-gradient(135deg, #fff8e0, #fff); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 25px rgba(255,255,255,0.3); }
    .datetime { background:#0e2638; padding:10px 25px; border-radius:30px; font-weight:bold; color:#ffd966; font-size:1.1rem; margin-top:5px; }

    @keyframes fade { from{opacity:0.3} to{opacity:1} }
    .card { background:rgba(10,25,40,0.75); backdrop-filter:blur(10px); border:1px solid #2e5a7a; border-radius:28px; padding:22px; margin-bottom:25px; box-shadow:0 15px 30px rgba(0,0,0,0.5); }
    .card h2 { color:#ffd966; margin-bottom:18px; border-left:8px solid #e6b800; padding-left:18px; font-weight:700; }

    .alert-warning { background:#3a2c0e; border-left:8px solid #e6b800; padding:20px; border-radius:18px; color:#ffe5a3; }
    .route-badge { display:inline-block; background:#1e405b; padding:6px 14px; border-radius:20px; margin:4px; font-size:0.9rem; }
    .gold-btn { background:linear-gradient(145deg, #f3c84e, #c99d1e); border:none; padding:14px 28px; border-radius:50px; font-weight:bold; font-size:1.2rem; color:#0a1c2c; box-shadow:0 5px 0 #7a5c00, 0 6px 15px black; cursor:pointer; border:1px solid #ffea9e; transition:0.1s; }
    .gold-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #7a5c00; }
    .btn-outline-light { background:transparent; border:2px solid #bcd3f0; color:#bcd3f0; padding:10px 20px; border-radius:40px; font-weight:bold; cursor:pointer; }
    table { width:100%; border-collapse:collapse; color:#e0ecf9; }
    th { background:#1d4e6e; color:#ffdb7c; padding:12px; text-align:left; }

    .grid-7 { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; }

    .input-group input { width:100%; padding:10px; border-radius:30px; border:none; background:#1e405b; color:white; font-weight:bold; text-align:center; margin-top:5px; }
    @media (max-width:600px) { .logo { font-size:2.5rem; } }

  <div id="actualizar" class="portada"><div class="card"><h2>🔄 Ingresar Resultados del Día</h2><div class="grid-7" id="formActualizar"></div><div style="display:flex; gap:20px; margin-top:30px;"><button class="gold-btn" id="guardarActualizacion">💾 Guardar</button><button class="btn-outline-light" id="limpiarForm">🧹 Limpiar</button></div></div></div>
</div>
<script>
(function(){
    const DATOS_REALES = [
        ["2025-10-01","GEORGIA","12:30:00","33","06","40"],["2025-10-01","FLORIDA","01:30:00","12","49","11"],["2025-10-01","NY","02:30:00","83","57","41"],["2025-10-01","GEORGIA","07:00:00","49","51","45"],["2025-10-01","FLORIDA","09:50:00","58","14","84"],["2025-10-01","NY","10:30:00","22","99","28"],["2025-10-01","GEORGIA","11:30:00","96","16","41"],
        ["2026-04-26","GEORGIA","12:53:00","84","06","72"],["2026-04-26","FLORIDA","13:35:00","95","38","16"],["2026-04-26","NY","14:35:00","10","67","08"],["2026-04-26","GEORGIA","19:05:00","09","16","52"],["2026-04-26","FLORIDA","21:48:00","96","12","36"],["2026-04-26","NY","22:30:00","54","82","44"],["2026-04-26","GEORGIA","23:40:00","09","74","28"],
        ["2026-04-27","GEORGIA","12:31:00","74","04","36"],["2026-04-27","FLORIDA","13:33:00","90","50","17"],["2026-04-27","NY","14:32:00","09","02","24"],["2026-04-27","GEORGIA","19:03:00","55","10","97"],["2026-04-27","FLORIDA","21:50:00","95","01","74"],["2026-04-27","NY","22:30:00","09","02","24"],["2026-04-27","GEORGIA","23:37:00","55","10","97"],
        ["2026-04-28","GEORGIA","12:31:00","10","14","09"],["2026-04-28","FLORIDA","13:38:00","90","55","89"],["2026-04-28","NY","14:38:00","53","74","03"],["2026-04-28","GEORGIA","19:03:00","10","14","09"],["2026-04-28","FLORIDA","21:50:00","27","59","55"],["2026-04-28","NY","22:33:00","05","86","66"],["2026-04-28","GEORGIA","23:38:00","48","89","81"],
        ["2026-04-29","GEORGIA","12:46:00","71","23","41"],["2026-04-29","FLORIDA","13:34:00","38","70","37"],["2026-04-29","NY","14:32:00","05","29","40"],["2026-04-29","GEORGIA","19:03:00","28","95","29"],["2026-04-29","FLORIDA","21:49:00","80","47","24"],["2026-04-29","NY","22:31:00","22","48","72"],["2026-04-29","GEORGIA","23:37:00","97","28","85"]
    ];

    let sorteos = DATOS_REALES.map(s => ({ fecha:s[0], loteria:s[1], horario:s[2], p1:s[3], p2:s[4], p3:s[5] }))
        .sort((a,b)=> (a.fecha+a.horario).localeCompare(b.fecha+b.horario));

    const SORTEOS_DIARIOS = [
        { loteria:'GEORGIA',horario:'12:30:00',label:'Georgia 12:30 PM' },
        { loteria:'FLORIDA',horario:'01:30:00',label:'Florida 01:30 PM' },
        { loteria:'NY',horario:'02:30:00',label:'New York 02:30 PM' },
        { loteria:'GEORGIA',horario:'07:00:00',label:'Georgia 07:00 PM' },
        { loteria:'FLORIDA',horario:'09:50:00',label:'Florida 09:50 PM' },
        { loteria:'NY',horario:'10:30:00',label:'New York 10:30 PM' },
        { loteria:'GEORGIA',horario:'11:30:00',label:'Georgia 11:30 PM' }
    ];

    const NUMEROS_CLAVE = ['61','73','00','89','99','56','70','16','41','28'];
    const estrategias = {
        '61': { objetivo:'GA / FL', ventana:3, combos:[['61','73','11'],['61','57','63'],['61','69','88']] },
        '73': { objetivo:'GEORGIA', ventana:4, combos:[['73','74','18'],['73','56','76']] },
        '00': { objetivo:'GEORGIA', ventana:3, combos:[['00','82','87'],['00','37','14'],['00','59','03']] },
        '89': { objetivo:'FLORIDA', ventana:3, combos:[['89','07','57'],['89','41','00']] },
        '99': { objetivo:'FLORIDA', ventana:3, combos:[['99','51','75'],['99','00','07']] },        '56': { objetivo:'GEORGIA', ventana:2, combos:[['56','56','06'],['56','70','91'],['56','04','03']] },
        '70': { objetivo:'FLORIDA', ventana:3, combos:[['70','08','22'],['70','12','37'],['70','68','75']] },
        '16': { objetivo:'GEORGIA', ventana:5, combos:[['16','76','20'],['16','37','96'],['16','12','38']] },
        '41': { objetivo:'GEORGIA', ventana:3, combos:[['41','64','86'],['41','02','67'],['41','98','06']] },
        '28': { objetivo:'NY', ventana:2, combos:[['28','72','19'],['28','77','26'],['28','94','18']] }
    };

    function formatoHora(h) {
        if(!h) return '';
        const [hh,mm] = h.split(':');
        let hora = parseInt(hh);
        const ampm = hora >= 12 ? 'PM' : 'AM';
        if (hora > 12) hora -= 12;
        if (hora === 0) hora = 12;
        return `${hora}:${mm} ${ampm}`;
    }

    function actualizarReloj() {
        const ahora = new Date();
        document.getElementById('liveDateTime').textContent = ahora.toLocaleDateString('es-ES',{weekday:'long', year:'numeric', month:'long', day:'numeric'}) + ' · ' + ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    setInterval(actualizarReloj, 1000); actualizarReloj();

    function getActivosPronosticoA() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const ultimos7 = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 7);
        const activos = [];
        NUMEROS_CLAVE.forEach(num => {
            const ocurrencias = ultimos7.filter(s => s.p2 === num || s.p3 === num);
            if(ocurrencias.length === 0) return;
            const ultima = ocurrencias[ocurrencias.length-1];
            const cfg = estrategias[num];
            if(!cfg) return;
            const diasRest = cfg.ventana - Math.floor((ahora - new Date(ultima.fecha))/86400000);
            if(diasRest <= 0) return;
            activos.push({ numero:num, fecha:ultima.fecha, pos:ultima.p2===num?'2ª':'3ª', loteria:ultima.loteria, horario:ultima.horario, cfg, diasRest });
        });
        return activos;
    }

    function calcularLoteriasFuertes(numero) {
        const conteo = {};
        sorteos.forEach(s => {
            if(s.p1 === numero) {
                const key = `${s.loteria} ${formatoHora(s.horario)}`;
                conteo[key] = (conteo[key] || 0) + 1;
            }
        });
        return Object.entries(conteo).sort((a,b)=> b[1]-a[1]).slice(0, 2);
    }
    function renderPronosticoA() {
        const activos = getActivosPronosticoA();
        let html = '';
        if(activos.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Ningún número clave activo en los últimos 7 días.</div>';
        else activos.forEach(a => {
            const fuertes = calcularLoteriasFuertes(a.numero);
            let strFuertes = fuertes.length > 0 ? fuertes.map(f => `<span class="route-badge">🔹 ${f[0]} (${f[1]} veces)</span>`).join(' ') : '<span class="route-badge">Toda lotería</span>';
            html += `<div class="signal-card priority-high">
                <div style="font-size:0.9rem; color:#bcd3f0;">🗓️ ${a.fecha} · ${a.loteria} ${formatoHora(a.horario)}</div>
                <div style="display:flex; align-items:center; margin-top:5px;">
                    <span class="number-highlight">${a.numero}</span>
                    <span style="margin-left:15px;">📡 Señal ${a.pos}</span>
                </div>
                <p style="margin-top:10px;">🎯 <strong>${a.cfg.objetivo}</strong> · Ventana: ${a.cfg.ventana} días (${a.diasRest} restantes)</p>
                <div style="margin-top:8px;">🕒 Loterías/Horarios más fuertes: ${strFuertes}</div>
                <div style="display:flex; gap:15px; margin-top:12px; flex-wrap:wrap;">
                    ${a.cfg.combos.map(c => `<code style="background:#1e405b; padding:8px 16px; border-radius:30px;">${c[0]}-${c[1]}-${c[2]}</code>`).join('')}
                </div>
            </div>`;
        });
        document.getElementById('contenedorA').innerHTML = html;
    }

    function calcPronosticoB() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 3);
        const resultados = [];
        const procesados = new Set();
        recientes.forEach(s => {
            [s.p2, s.p3].forEach(num => {
                if(procesados.has(num)) return;
                procesados.add(num);
                const totalApariciones = sorteos.filter(x => x.p2===num || x.p3===num).length;
                const exitos = sorteos.filter(x => (x.p2===num || x.p3===num) && 
                    sorteos.some(y => y.fecha >= x.fecha && y.fecha <= x.fecha+3 && y.p1===num)).length;
                if(totalApariciones >= 3 && (exitos/totalApariciones) >= 0.5) {
                    resultados.push({ numero:num, tasa:Math.round(exitos/totalApariciones*100), total:totalApariciones, exitos });
                }
            });
        });
        return resultados.slice(0, 5);
    }

    function renderPronosticoB() {
        const arrastres = calcPronosticoB();
        let html = '';
        if(arrastres.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin arrastres confiables.</div>';
        else arrastres.forEach(a => {
            const fuertes = calcularLoteriasFuertes(a.numero);            let strFuertes = fuertes.length > 0 ? fuertes.map(f => `<span class="route-badge">🔹 ${f[0]} (${f[1]})</span>`).join(' ') : '';
            html += `<div class="signal-card" style="border-color:#ff9966;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight">${a.numero}</span>
                    <span style="margin-left:15px;">🔥 Arrastre histórico: ${a.tasa}% (${a.exitos} de ${a.total})</span>
                </div>
                <p style="margin-top:10px;">📈 Tiende a aparecer en 1ª posición en 3 días.</p>
                ${strFuertes ? `<div style="margin-top:6px;">🕒 Más frecuente en: ${strFuertes}</div>` : ''}
            </div>`;
        });
        document.getElementById('contenedorB').innerHTML = html;
    }

    function calcPercutores() {
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 3);
        const percutorsMap = new Map();
        for(let i=0; i<sorteos.length; i++) {
            const s = sorteos[i];
            const Ys = [s.p2, s.p3];
            const siguientes = sorteos.filter(x => x.fecha >= s.fecha && x.fecha <= s.fecha+3);
            siguientes.forEach(x => {
                const X = x.p1;
                Ys.forEach(Y => {
                    if(Y === X) return;
                    if(!percutorsMap.has(Y)) percutorsMap.set(Y, new Map());
                    const inner = percutorsMap.get(Y);
                    if(!inner.has(X)) inner.set(X, {aciertos:0, total:0});
                    inner.get(X).aciertos++;
                });
            });
        }
        const totalY = {};
        sorteos.forEach(s => { [s.p2, s.p3].forEach(Y => { totalY[Y] = (totalY[Y]||0)+1; }); });
        const activosMap = new Map();
        recientes.forEach(s => {
            [s.p2, s.p3].forEach(Y => {
                if(activosMap.has(Y) || !percutorsMap.has(Y)) return;
                const candidatos = [];
                const mapaY = percutorsMap.get(Y);
                mapaY.forEach((val, X) => {
                    if(val.aciertos >= 3 && totalY[Y] && (val.aciertos/totalY[Y]) >= 0.5) {
                        candidatos.push({ X, tasa:Math.round(val.aciertos/totalY[Y]*100) });
                    }
                });
                if(candidatos.length > 0) {
                    candidatos.sort((a,b)=> b.tasa - a.tasa);
                    activosMap.set(Y, candidatos.slice(0,3));
                }
            });        });
        return Array.from(activosMap.entries()).map(([Y, destinos]) => ({ Y, destinos }));
    }

    function renderPronosticoC() {
        const percutores = calcPercutores();
        let html = '';
        if(percutores.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin percutores válidos.</div>';
        else percutores.forEach(p => {
            html += `<div class="signal-card" style="border-color:#a569bd;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight">${p.Y}</span>
                    <span style="margin-left:15px;">🧲 Percutor activo</span>
                </div>
                <p style="margin-top:10px;">🎯 Anuncia a:</p>
                <div style="display:flex; gap:12px; margin-top:8px; flex-wrap:wrap;">
                    ${p.destinos.map(d => `<code style="background:#1e405b; padding:8px 18px; border-radius:20px;">${d.X} → ${d.tasa}%</code>`).join('')}
                </div>
            </div>`;
        });
        document.getElementById('contenedorC').innerHTML = html;
    }

    function calcDobles() {
        const dobles = ['00','11','22','33','44','55','66','77','88','99'];
        const ahora = new Date(); ahora.setHours(0,0,0,0);
        const recientes = sorteos.filter(s => (ahora - new Date(s.fecha))/86400000 <= 3);
        const presentes = new Set();
        recientes.forEach(s => {
            [s.p1, s.p2, s.p3].forEach(val => {
                if(dobles.includes(val)) presentes.add(val);
            });
        });
        return Array.from(presentes);
    }

    function renderPronosticoD() {
        const dobles = calcDobles();
        let html = '';
        if(dobles.length === 0) html = '<div class="alert-warning">⚠️ No jugar. Sin dobles activos.</div>';
        else dobles.forEach(d => { 
            html += `<div class="signal-card" style="border-color:#f4d03f; background:#1e2f1e;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight">${d}</span>
                    <span style="margin-left:15px; color:#f4d03f;">👁️ OJO (doble detectado)</span>
                </div>
                <p style="margin-top:10px;">Históricamente, los dobles suelen repetirse o venir acompañados en 48h.</p>
            </div>`;
        });
        document.getElementById('contenedorD').innerHTML = html;    }

    function calcPaleActivo() {
        const activosNum = getActivosPronosticoA().map(a => a.numero);
        if (activosNum.length === 0) return null;
        const parejasCount = {};
        sorteos.forEach(s => {
            const pares = [[s.p1, s.p2], [s.p1, s.p3], [s.p2, s.p3]];
            pares.forEach(par => {
                if (activosNum.includes(par[0]) || activosNum.includes(par[1])) {
                    const key = par.join('-');
                    if(!parejasCount[key]) parejasCount[key] = { count: 0, loterias: {} };
                    parejasCount[key].count++;
                    const lotKey = `${s.loteria} ${formatoHora(s.horario)}`;
                    parejasCount[key].loterias[lotKey] = (parejasCount[key].loterias[lotKey] || 0) + 1;
                }
            });
        });
        return Object.entries(parejasCount)
            .filter(([_, data]) => data.count >= 3)
            .sort((a, b) => b[1].count - a[1].count)
            .slice(0, 5)
            .map(([key, data]) => {
                const loteriasSorted = Object.entries(data.loterias).sort((a,b)=> b[1]-a[1]);
                const loteriaFuerte = loteriasSorted.length > 0 ? loteriasSorted[0][0] : 'General';
                return { pareja: key, frecuencia: data.count, loteriaFuerte };
            });
    }

    function renderPaleActivo() {
        const pales = calcPaleActivo();
        const container = document.getElementById('paleActivoContainer');
        if (!pales || pales.length === 0) {
            container.innerHTML = '<div class="alert-warning">⚠️ No jugar. No hay parejas activas con suficiente respaldo hoy.</div>';
            return;
        }
        let html = '';
        pales.forEach(p => {
            const numeros = p.pareja.split('-');
            html += `<div class="signal-card" style="border-color:#17a589;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight" style="font-size:2rem;">${numeros[0]}</span>
                    <span style="margin:0 15px; font-size:2rem;">•</span>
                    <span class="number-highlight" style="font-size:2rem;">${numeros[1]}</span>
                </div>
                <p style="margin-top:10px;">Frecuencia histórica: <strong>${p.frecuencia} apariciones</strong></p>
                <p style="font-size:0.9rem; color:#bcd3f0;">🎯 Más fuerte en: ${p.loteriaFuerte}</p>
            </div>`;
        });
        container.innerHTML = html;    }

    function calcRespaldoMultiple() {
        const respaldo = new Map();
        const activosA = getActivosPronosticoA().map(a => a.numero);
        activosA.forEach(num => {
            if(!respaldo.has(num)) respaldo.set(num, { ventanas: [], total: 0 });
            respaldo.get(num).ventanas.push('A');
        });
        const activosB = calcPronosticoB().map(b => b.numero);
        activosB.forEach(num => {
            if(!respaldo.has(num)) respaldo.set(num, { ventanas: [], total: 0 });
            respaldo.get(num).ventanas.push('B');
        });
        const activosC = calcPercutores().map(p => p.Y);
        activosC.forEach(num => {
            if(!respaldo.has(num)) respaldo.set(num, { ventanas: [], total: 0 });
            respaldo.get(num).ventanas.push('C');
        });
        const activosD = calcDobles();
        activosD.forEach(num => {
            if(!respaldo.has(num)) respaldo.set(num, { ventanas: [], total: 0 });
            respaldo.get(num).ventanas.push('D');
        });
        const activosPale = [];
        const pales = calcPaleActivo();
        if(pales) {
            pales.forEach(p => {
                const nums = p.pareja.split('-');
                if(!activosPale.includes(nums[0])) activosPale.push(nums[0]);
                if(!activosPale.includes(nums[1])) activosPale.push(nums[1]);
            });
        }
        activosPale.forEach(num => {
            if(!respaldo.has(num)) respaldo.set(num, { ventanas: [], total: 0 });
            respaldo.get(num).ventanas.push('P');
        });
        const resultado = [];
        respaldo.forEach((val, num) => {
            val.total = val.ventanas.length;
            if(val.total >= 2) {
                resultado.push({ numero: num, ventanas: val.ventanas, total: val.total });
            }
        });
        resultado.sort((a,b)=> b.total - a.total || a.numero.localeCompare(b.numero));
        return resultado;
    }

    function renderRespaldoMultiple() {
        const respaldos = calcRespaldoMultiple();        const container = document.getElementById('respaldoContainer');
        if(respaldos.length === 0) {
            container.innerHTML = '<div class="alert-warning">⏳ En espera. Ningún número tiene respaldo múltiple hoy.</div>';
            return;
        }
        let html = '';
        const iconos = { A:'🎯', B:'🔥', C:'🧲', D:'💎', P:'🎲' };
        respaldos.forEach(r => {
            const iconStr = r.ventanas.map(v => `<span title="Pronóstico ${v}">${iconos[v]}</span>`).join(' ');
            html += `<div class="signal-card" style="border-color:#ffd700; background:#1a2e1a;">
                <div style="display:flex; align-items:center;">
                    <span class="number-highlight">${r.numero}</span>
                    <span style="margin-left:15px;">⭐ Respaldo: ${iconStr} (${r.total} ventanas)</span>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function runMonteCarlo(sims, freqP1) {
        const buildCumulative = (freqMap) => {
            const entries = Object.entries(freqMap).sort((a,b)=> a[0].localeCompare(b[0]));
            const nums = [], cum = [];
            let total = 0;
            for(const [num, count] of entries) {
                nums.push(num);
                total += count;
                cum.push(total);
            }
            return { nums, cum, total };
        };
        const p1Cum = buildCumulative(freqP1);
        const pick = (cumData) => {
            const r = Math.random() * cumData.total;
            let low = 0, high = cumData.cum.length - 1;
            while(low < high) {
                const mid = (low + high) >>> 1;
                if(cumData.cum[mid] < r) low = mid + 1;
                else high = mid;
            }
            return cumData.nums[low];
        };
        const counts = {};
        for(let i=0; i<sims; i++) {
            const p1 = pick(p1Cum);
            counts[p1] = (counts[p1] || 0) + 1;
        }
        const results = Object.entries(counts).map(([num, cnt]) => ({ num, prob: (cnt/sims*100) }));
        results.sort((a,b)=> b.prob - a.prob);
        return results.slice(0, 5);    }

    function renderMonteCarlo() {
        const container = document.getElementById('montecarloContainer');
        container.innerHTML = '<p style="text-align:center; color:#ffd966;">⏳ Ejecutando simulaciones Monte Carlo...</p>';
        setTimeout(() => {
            const freqP1 = {};
            sorteos.forEach(s => { freqP1[s.p1] = (freqP1[s.p1] || 0) + 1; });
            const top10k = runMonteCarlo(10000, freqP1);
            const top20k = runMonteCarlo(20000, freqP1);
            let html = '<div style="display:flex; gap:20px; flex-wrap:wrap;">';
            html += '<div style="flex:1; min-width:280px;"><h3 style="color:#ffd966;">🔹 10,000 Simulaciones</h3>';
            top10k.forEach(r => {
                html += `<div class="signal-card" style="border-color:#17a589;"><span class="number-highlight" style="font-size:2rem;">${r.num}</span> <span style="margin-left:15px;">Probabilidad: ${r.prob.toFixed(2)}%</span></div>`;
            });
            html += '</div><div style="flex:1; min-width:280px;"><h3 style="color:#ffd966;">🔸 20,000 Simulaciones</h3>';
            top20k.forEach(r => {
                html += `<div class="signal-card" style="border-color:#8e44ad;"><span class="number-highlight" style="font-size:2rem;">${r.num}</span> <span style="margin-left:15px;">Probabilidad: ${r.prob.toFixed(2)}%</span></div>`;
            });
            html += '</div></div>';
            const same = top10k[0] && top20k[0] && top10k[0].num === top20k[0].num;
            html += `<p style="margin-top:20px; color:#bcd3f0;">📊 <strong>Convergencia:</strong> ${same ? '✅ Los resultados confirman el número principal.' : '⚠️ Hay variación entre simulaciones.'}</p>`;
            container.innerHTML = html;
        }, 50);
    }

    function renderHistorial() {
        const tbody = document.getElementById('historialBody');
        const sorted = [...sorteos].reverse();
        let html = '';
        sorted.slice(0, 100).forEach(s => { html += `<tr><td>${s.fecha}</td><td>${s.loteria}</td><td>${formatoHora(s.horario)}</td><td>${s.p1}</td><td>${s.p2}</td><td>${s.p3}</td></tr>`; });
        tbody.innerHTML = html || '<tr><td colspan="6">Sin datos</td></tr>';
    }

    function renderFormActualizar() {
        const cont = document.getElementById('formActualizar');
        const hoy = new Date().toISOString().slice(0,10);
        let html = '';
        SORTEOS_DIARIOS.forEach((s, idx) => {
            html += `<div class="input-group"><label>${s.label}</label><input type="text" id="p1_${idx}" placeholder="1ª" maxlength="2" value=""><input type="text" id="p2_${idx}" placeholder="2ª" maxlength="2" value="" style="margin-top:5px;"><input type="text" id="p3_${idx}" placeholder="3ª" maxlength="2" value="" style="margin-top:5px;"><input type="hidden" id="fecha_${idx}" value="${hoy}"></div>`;
        });
        cont.innerHTML = html;
    }

    document.getElementById('guardarActualizacion').addEventListener('click', ()=>{
        const hoy = new Date().toISOString().slice(0,10);
        const nuevosDelDia = [];
        for(let i=0; i<7; i++) {
            const p1 = document.getElementById(`p1_${i}`)?.value.trim().padStart(2,'0');
            const p2 = document.getElementById(`p2_${i}`)?.value.trim().padStart(2,'0');            const p3 = document.getElementById(`p3_${i}`)?.value.trim().padStart(2,'0');
            if(!/^\d{2}$/.test(p1) || !/^\d{2}$/.test(p2) || !/^\d{2}$/.test(p3)) continue;
            const sorteo = SORTEOS_DIARIOS[i];
            nuevosDelDia.push({ fecha:hoy, loteria:sorteo.loteria, horario:sorteo.horario, p1, p2, p3 });
        }
        if(nuevosDelDia.length > 0) {
            const clavesExistentes = new Set(sorteos.map(s => s.fecha+s.loteria+s.horario));
            let agregados = 0;
            nuevosDelDia.forEach(s => { if(!clavesExistentes.has(s.fecha+s.loteria+s.horario)) { sorteos.push(s); agregados++; } });
            if(agregados > 0) { 
                renderHistorial(); 
                recalcAll();
                alert(`✅ ${agregados} sorteos guardados.`); 
                renderFormActualizar(); 
            }
        } else { alert('⚠️ Completa al menos un sorteo.'); }
    });
    document.getElementById('limpiarForm').addEventListener('click', renderFormActualizar);

    function recalcAll() {
        renderPronosticoA();
        renderPronosticoB();
        renderPronosticoC();
        renderPronosticoD();
        renderPaleActivo();
        renderRespaldoMultiple();
    }

    const tabs = document.querySelectorAll('.tab-btn');
    const portadas = document.querySelectorAll('.portada');
    tabs.forEach(t => t.addEventListener('click', ()=>{
        const id = t.dataset.tab;
        tabs.forEach(bt => bt.classList.remove('active'));
        portadas.forEach(p => p.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(id).classList.add('active');
        if(id === 'historial') renderHistorial();
        else if(id === 'pronosticoA') renderPronosticoA();
        else if(id === 'pronosticoB') renderPronosticoB();
        else if(id === 'pronosticoC') renderPronosticoC();
        else if(id === 'pronosticoD') renderPronosticoD();
        else if(id === 'paleactivo') renderPaleActivo();
        else if(id === 'respaldo') renderRespaldoMultiple();
        else if(id === 'montecarlo') renderMonteCarlo();
    }));

    renderHistorial();
    renderFormActualizar();
    recalcAll();
})();</script>
